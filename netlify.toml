# Netlify configuration.
# This is a plain static site: there is no build step, the repository root is published as is.

[build]
  publish = "."

# Security headers for every page and asset.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Only what the site really uses is allowed: its own files and Google Fonts (CSS + font
    # files). Icons are inline SVG, so no icon host is needed. The contact form posts to the
    # same origin (Netlify Forms). If you add a new third-party script, font or embed, add
    # its host here or the browser will block it.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
